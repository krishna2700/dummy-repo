<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --x-color: #6366f1;
      --o-color: #f43f5e;
      --x-light: #eef2ff;
      --o-light: #fff1f2;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #263349;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --radius: 16px;
      --win: #22c55e;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--x-color), var(--o-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* Score board */
    .scoreboard {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 360px;
    }

    .score-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .score-card .label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-card .value {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-card.x-card .value { color: var(--x-color); }
    .score-card.draw-card .value { color: var(--muted); }
    .score-card.o-card .value { color: var(--o-color); }

    /* Status banner */
    .status {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
      transition: all 0.3s ease;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .status.x-turn .dot { background: var(--x-color); }
    .status.o-turn .dot { background: var(--o-color); }
    .status.win { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.4); color: var(--win); }
    .status.draw { background: var(--surface2); color: var(--muted); }
    .status.win .dot, .status.draw .dot { display: none; }

    /* Board */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 20px;
    }

    .cell {
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 3.5rem);
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.2s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .cell:hover:not(.taken) {
      background: var(--surface2);
      border-color: #475569;
      transform: scale(1.04);
    }

    .cell.taken { cursor: default; }

    .cell.x {
      color: var(--x-color);
      border-color: rgba(99,102,241,0.35);
      background: rgba(99,102,241,0.07);
    }

    .cell.o {
      color: var(--o-color);
      border-color: rgba(244,63,94,0.35);
      background: rgba(244,63,94,0.07);
    }

    .cell.winning {
      background: rgba(34,197,94,0.14);
      border-color: rgba(34,197,94,0.5);
      animation: winner-pop 0.5s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }

    @keyframes winner-pop {
      0% { transform: scale(1); }
      30% { transform: scale(1.12); }
      60% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    .cell .mark {
      display: inline-block;
      animation: pop-in 0.25s cubic-bezier(0.36,0.07,0.19,0.97) both;
    }

    @keyframes pop-in {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* Mode selector */
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--x-color);
      border-color: var(--x-color);
      color: #fff;
    }

    .mode-btn:hover:not(.active) {
      border-color: #475569;
      color: var(--text);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      flex: 1;
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--x-color), var(--o-color));
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.88; transform: translateY(-2px); }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-secondary:hover { border-color: #475569; color: var(--text); transform: translateY(-1px); }

    /* Difficulty */
    .difficulty {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 360px;
    }

    .diff-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .diff-btn.active { background: var(--surface2); border-color: #475569; color: var(--text); }
    .diff-btn:hover:not(.active) { border-color: #475569; }

    .difficulty-row { display: none; }
    .difficulty-row.visible { display: flex; }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<p class="subtitle">Two players · Local or vs AI</p>

<!-- Mode toggle -->
<div class="mode-toggle">
  <button class="mode-btn active" id="btn2p" onclick="setMode(false)">2 Players</button>
  <button class="mode-btn" id="btnAI" onclick="setMode(true)">vs AI</button>
</div>

<!-- AI difficulty (hidden in 2P mode) -->
<div class="difficulty difficulty-row" id="diffRow">
  <button class="diff-btn active" id="dEasy" onclick="setDiff('easy')">Easy</button>
  <button class="diff-btn" id="dMed" onclick="setDiff('medium')">Medium</button>
  <button class="diff-btn" id="dHard" onclick="setDiff('hard')">Hard</button>
</div>

<!-- Scoreboard -->
<div class="scoreboard">
  <div class="score-card x-card">
    <div class="label" id="labelX">X</div>
    <div class="value" id="scoreX">0</div>
  </div>
  <div class="score-card draw-card">
    <div class="label">Draws</div>
    <div class="value" id="scoreDraw">0</div>
  </div>
  <div class="score-card o-card">
    <div class="label" id="labelO">O</div>
    <div class="value" id="scoreO">0</div>
  </div>
</div>

<!-- Status -->
<div class="status x-turn" id="status">
  <span class="dot"></span>
  <span id="statusText">Player X&apos;s turn</span>
</div>

<!-- Board -->
<div class="board" id="board">
  <div class="cell" onclick="handleClick(0)"><span class="mark" id="c0"></span></div>
  <div class="cell" onclick="handleClick(1)"><span class="mark" id="c1"></span></div>
  <div class="cell" onclick="handleClick(2)"><span class="mark" id="c2"></span></div>
  <div class="cell" onclick="handleClick(3)"><span class="mark" id="c3"></span></div>
  <div class="cell" onclick="handleClick(4)"><span class="mark" id="c4"></span></div>
  <div class="cell" onclick="handleClick(5)"><span class="mark" id="c5"></span></div>
  <div class="cell" onclick="handleClick(6)"><span class="mark" id="c6"></span></div>
  <div class="cell" onclick="handleClick(7)"><span class="mark" id="c7"></span></div>
  <div class="cell" onclick="handleClick(8)"><span class="mark" id="c8"></span></div>
</div>

<!-- Actions -->
<div class="actions">
  <button class="btn btn-primary" onclick="newGame()">New Game</button>
  <button class="btn btn-secondary" onclick="resetScores()">Reset Scores</button>
</div>

<footer>Click a cell to play &middot; Built with vanilla JS</footer>

<script>
  // ─── State ────────────────────────────────────────────────────────────────
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8], // rows
    [0,3,6],[1,4,7],[2,5,8], // cols
    [0,4,8],[2,4,6]           // diags
  ];

  let board = Array(9).fill(null);
  let current = "X";
  let gameOver = false;
  let vsAI = false;
  let difficulty = "easy";
  let scores = { X: 0, O: 0, Draw: 0 };

  // ─── Mode & Difficulty ───────────────────────────────────────────────────
  function setMode(ai) {
    vsAI = ai;
    document.getElementById("btn2p").classList.toggle("active", !ai);
    document.getElementById("btnAI").classList.toggle("active", ai);
    document.getElementById("diffRow").classList.toggle("visible", ai);
    document.getElementById("labelO").textContent = ai ? "AI" : "O";
    newGame();
  }

  function setDiff(d) {
    difficulty = d;
    ["dEasy","dMed","dHard"].forEach(id => document.getElementById(id).classList.remove("active"));
    document.getElementById({easy:"dEasy",medium:"dMed",hard:"dHard"}[d]).classList.add("active");
    newGame();
  }

  // ─── Game Logic ──────────────────────────────────────────────────────────
  function handleClick(idx) {
    if (gameOver || board[idx]) return;
    if (vsAI && current === "O") return; // AI's turn
    play(idx);
    if (vsAI && !gameOver && current === "O") {
      setTimeout(aiMove, 420);
    }
  }

  function play(idx) {
    board[idx] = current;
    renderCell(idx);
    const result = checkResult();
    if (result) { endGame(result); return; }
    current = current === "X" ? "O" : "X";
    updateStatus();
  }

  function renderCell(idx) {
    const cell = document.querySelectorAll(".cell")[idx];
    const mark = document.getElementById("c" + idx);
    mark.textContent = board[idx];
    cell.classList.add("taken", board[idx].toLowerCase());
    // re-trigger animation
    mark.style.animation = "none";
    mark.offsetHeight;
    mark.style.animation = "";
  }

  function checkResult() {
    for (const combo of WINS) {
      const [a, b, c] = combo;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], combo };
      }
    }
    if (board.every(Boolean)) return { winner: null }; // draw
    return null;
  }

  function endGame(result) {
    gameOver = true;
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    if (result.winner) {
      scores[result.winner]++;
      updateScores();
      // highlight winning cells
      result.combo.forEach(i => document.querySelectorAll(".cell")[i].classList.add("winning"));
      const name = vsAI && result.winner === "O" ? "AI" : "Player " + result.winner;
      statusText.textContent = name + " wins! 🎉";
      status.className = "status win";
    } else {
      scores.Draw++;
      updateScores();
      statusText.textContent = "It's a draw!";
      status.className = "status draw";
    }
  }

  function updateStatus() {
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const name = vsAI && current === "O" ? "AI" : "Player " + current;
    statusText.textContent = name + "'s turn";
    status.className = "status " + (current === "X" ? "x-turn" : "o-turn");
  }

  function updateScores() {
    document.getElementById("scoreX").textContent = scores.X;
    document.getElementById("scoreO").textContent = scores.O;
    document.getElementById("scoreDraw").textContent = scores.Draw;
  }

  function newGame() {
    board = Array(9).fill(null);
    current = "X";
    gameOver = false;
    document.querySelectorAll(".cell").forEach(c => {
      c.className = "cell";
      c.setAttribute("onclick", "handleClick(" + [...document.querySelectorAll(".cell")].indexOf(c) + ")");
    });
    for (let i = 0; i < 9; i++) document.getElementById("c" + i).textContent = "";
    updateStatus();
  }

  function resetScores() {
    scores = { X: 0, O: 0, Draw: 0 };
    updateScores();
    newGame();
  }

  // ─── AI ──────────────────────────────────────────────────────────────────
  function aiMove() {
    if (gameOver) return;
    let idx;
    if (difficulty === "easy")   idx = randomMove();
    else if (difficulty === "medium") idx = Math.random() < 0.5 ? bestMove() : randomMove();
    else idx = bestMove(); // hard = minimax
    play(idx);
  }

  function randomMove() {
    const empties = board.map((v,i) => v ? null : i).filter(v => v !== null);
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function bestMove() {
    let bestScore = -Infinity, bestIdx = -1;
    board.forEach((v, i) => {
      if (!v) {
        board[i] = "O";
        const score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) { bestScore = score; bestIdx = i; }
      }
    });
    return bestIdx;
  }

  function minimax(b, depth, isMax) {
    const res = checkResult();
    if (res) {
      if (res.winner === "O") return 10 - depth;
      if (res.winner === "X") return depth - 10;
      return 0;
    }
    if (isMax) {
      let best = -Infinity;
      b.forEach((v, i) => { if (!v) { b[i]="O"; best=Math.max(best,minimax(b,depth+1,false)); b[i]=null; } });
      return best;
    } else {
      let best = Infinity;
      b.forEach((v, i) => { if (!v) { b[i]="X"; best=Math.min(best,minimax(b,depth+1,true)); b[i]=null; } });
      return best;
    }
  }
</script>
</body>
</html>
