<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigate to Dashboard</title>
  <!-- React via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX transpilation in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #6c63ff, #48cfad);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 8px 24px rgba(108, 99, 255, 0.45);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(108, 99, 255, 0.55);
      opacity: 0.92;
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── Dashboard "page" shown after navigation ── */
    .dashboard {
      text-align: left;
    }

    .dashboard h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
    }

    .dashboard .subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #48cfad;
    }

    .stat-card .label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.55);
      margin-top: 4px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 10px 24px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function HomePage({ onNavigate }) {
      return (
        <div className="card">
          <h1>Welcome</h1>
          <p>Click the button below to navigate to the Dashboard.</p>
          <button className="btn" onClick={() => onNavigate('/dashboard')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Go to Dashboard
          </button>
        </div>
      );
    }

    function DashboardPage({ onNavigate }) {
      return (
        <div className="card dashboard">
          <h1>Dashboard</h1>
          <p className="subtitle">You navigated to /dashboard successfully.</p>
          <div className="stats">
            <div className="stat-card">
              <div className="value">142</div>
              <div className="label">Users</div>
            </div>
            <div className="stat-card">
              <div className="value">$8.4k</div>
              <div className="label">Revenue</div>
            </div>
            <div className="stat-card">
              <div className="value">98%</div>
              <div className="label">Uptime</div>
            </div>
          </div>
          <button className="back-btn" onClick={() => onNavigate('/')}>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Back to Home
          </button>
        </div>
      );
    }

    function App() {
      // Sync state with browser URL
      const [path, setPath] = useState(window.location.pathname);

      function navigate(to) {
        window.history.pushState({}, '', to);
        setPath(to);
      }

      // Handle browser back/forward
      window.onpopstate = () => setPath(window.location.pathname);

      if (path === '/dashboard') return <DashboardPage onNavigate={navigate} />;
      return <HomePage onNavigate={navigate} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
