<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto README Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3148;
      --accent: #6c63ff;
      --accent-hover: #7c73ff;
      --accent-glow: rgba(108,99,255,0.25);
      --text: #e8eaf6;
      --muted: #8b90b0;
      --green: #4ade80;
      --red: #f87171;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }
    header .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header span { color: var(--muted); font-size: 0.85rem; margin-left: 4px; font-weight: 400; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      height: calc(100vh - 65px);
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select option { background: var(--surface2); }

    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .lang-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .lang-btn:hover { border-color: var(--accent); background: var(--accent-glow); }
    .lang-btn.active { border-color: var(--accent); background: var(--accent-glow); color: #a78bfa; }
    .lang-btn .flag { font-size: 1rem; }

    .checkbox-row {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .checkbox-row input[type=checkbox] {
      width: 16px; height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .sections-grid {
      display: flex; flex-direction: column; gap: 6px;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 20px var(--accent-glow);
      letter-spacing: 0.01em;
    }
    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--accent-glow); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .output-pane {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .output-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .output-toolbar .tab-group { display: flex; gap: 4px; }
    .tab-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.83rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--surface2); border-color: var(--border); color: var(--text); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    .action-btns { display: flex; gap: 8px; }
    .action-btn {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.success { border-color: var(--green); color: var(--green); }

    .file-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
    }

    .output-content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      position: relative;
    }

    #raw-view {
      padding: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.75;
      color: #c9d1f5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #preview-view {
      padding: 32px 40px;
      line-height: 1.75;
      color: var(--text);
      max-width: 820px;
    }
    #preview-view h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    #preview-view h2 { font-size: 1.2rem; font-weight: 700; margin: 24px 0 8px; color: #a78bfa; }
    #preview-view h3 { font-size: 1rem; font-weight: 600; margin: 16px 0 6px; }
    #preview-view p { color: var(--muted); margin-bottom: 10px; }
    #preview-view code { font-family: 'JetBrains Mono', monospace; background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 0.82em; color: #a78bfa; }
    #preview-view pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 12px 0; }
    #preview-view pre code { background: none; padding: 0; color: #c9d1f5; font-size: 0.85rem; }
    #preview-view ul, #preview-view ol { padding-left: 20px; color: var(--muted); margin-bottom: 10px; }
    #preview-view li { margin-bottom: 4px; }
    #preview-view table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    #preview-view th, #preview-view td { border: 1px solid var(--border); padding: 8px 12px; font-size: 0.88rem; }
    #preview-view th { background: var(--surface2); font-weight: 600; }
    #preview-view blockquote { border-left: 3px solid var(--accent); padding: 6px 16px; color: var(--muted); background: var(--surface); border-radius: 0 6px 6px 0; margin: 10px 0; }
    #preview-view a { color: var(--accent); text-decoration: none; }
    #preview-view hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    #preview-view .badge { display: inline-block; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; margin: 2px; font-family: 'JetBrains Mono', monospace; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .empty-state .icon { font-size: 4rem; opacity: 0.3; }
    .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 0.88rem; max-width: 300px; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
      .sidebar { max-height: 60vh; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">📄</div>
  <h1>Auto README Generator <span>— any language, one click</span></h1>
</header>

<main>
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="field">
      <label>Project Name</label>
      <input id="projName" type="text" placeholder="e.g. my-awesome-app" value="my-awesome-app"/>
    </div>

    <div class="field">
      <label>Short Description</label>
      <input id="projDesc" type="text" placeholder="What does this project do?" value="A blazing-fast web application built with modern tools"/>
    </div>

    <div class="field">
      <label>Tech Stack / Language</label>
      <input id="techStack" type="text" placeholder="e.g. Python, React, Node.js" value="React, Node.js, MongoDB"/>
    </div>

    <div class="field">
      <label>Author / GitHub Username</label>
      <input id="author" type="text" placeholder="your-github-username" value="krishna2700"/>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:10px;">README Language</div>
      <div class="lang-grid" id="langGrid">
        <!-- populated by JS -->
      </div>
    </div>

    <div>
      <div class="section-title" style="margin-bottom:10px;">Include Sections</div>
      <div class="sections-grid" id="sectionsGrid">
        <!-- populated by JS -->
      </div>
    </div>

    <div class="field">
      <label>Badge Style</label>
      <select id="badgeStyle">
        <option value="flat">Flat</option>
        <option value="flat-square">Flat Square</option>
        <option value="for-the-badge" selected>For The Badge</option>
        <option value="plastic">Plastic</option>
      </select>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateReadme()">
      <span>✦</span> Generate README
    </button>

  </aside>

  <!-- OUTPUT -->
  <section class="output-pane">
    <div class="output-toolbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="tab-group">
          <button class="tab-btn active" id="tabRaw" onclick="switchTab('raw')">Raw Markdown</button>
          <button class="tab-btn" id="tabPreview" onclick="switchTab('preview')">Preview</button>
        </div>
        <span class="file-badge" id="fileBadge">README.md</span>
      </div>
      <div class="action-btns">
        <button class="action-btn" onclick="copyReadme()" id="copyBtn">⧉ Copy</button>
        <button class="action-btn" onclick="downloadReadme()" id="downloadBtn">↓ Download</button>
      </div>
    </div>
    <div class="output-content" id="outputContent">
      <div class="empty-state">
        <div class="icon">🗒️</div>
        <h3>No README generated yet</h3>
        <p>Fill in your project details on the left, pick a language, and click <strong>Generate README</strong>.</p>
      </div>
    </div>
  </section>
</main>

// ─── STATE ─────────────────────────────────────────────────────────────────────
let selectedLang = 'en';
let currentMarkdown = '';
let currentTab = 'raw';

// ─── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  // Build lang grid
  const grid = document.getElementById('langGrid');
  LANGUAGES.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (l.code === 'en' ? ' active' : '');
    btn.dataset.code = l.code;
    btn.innerHTML = `<span class="flag">${l.flag}</span>${l.label}`;
    btn.onclick = () => selectLang(l.code);
    grid.appendChild(btn);
  });

  // Build sections checkboxes
  const sg = document.getElementById('sectionsGrid');
  SECTIONS.forEach(s => {
    const label = document.createElement('label');
    label.className = 'checkbox-row';
    label.innerHTML = `<input type="checkbox" id="sec_${s.key}" ${s.default ? 'checked' : ''}> ${s.label}`;
    sg.appendChild(label);
  });
}

function selectLang(code) {
  selectedLang = code;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.code === code));
  // Update file badge
  const badge = document.getElementById('fileBadge');
  badge.textContent = code === 'en' ? 'README.md' : `README.${code}.md`;
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabRaw').classList.toggle('active', tab === 'raw');
  document.getElementById('tabPreview').classList.toggle('active', tab === 'preview');
  renderOutput();
}

// ─── GENERATE ─────────────────────────────────────────────────────────────────
function generateReadme() {
  const name    = document.getElementById('projName').value.trim() || 'my-project';
  const desc    = document.getElementById('projDesc').value.trim() || 'An awesome project';
  const stack   = document.getElementById('techStack').value.trim() || 'JavaScript';
  const author  = document.getElementById('author').value.trim() || 'user';
  const badge   = document.getElementById('badgeStyle').value;
  const t       = T[selectedLang] || T.en;
  const lang    = selectedLang;

  const secs = {};
  SECTIONS.forEach(s => { secs[s.key] = document.getElementById('sec_' + s.key).checked; });

  const slug = name.toLowerCase().replace(/\s+/g,'-');
  const stackArr = stack.split(/[,\/]+/).map(s=>s.trim()).filter(Boolean);
  const badgeColor = 'blue';

  let md = '';

  // Title
  md += `<div align="center">\n\n`;
  md += `# ${name}\n\n`;
  md += `### ${desc}\n\n`;

  // Badges
  if (secs.badges) {
    stackArr.forEach(tech => {
      const label = encodeURIComponent(tech);
      md += `![${tech}](https://img.shields.io/badge/${label}-informational?style=${badge}&logo=${label.toLowerCase()}&logoColor=white&color=6c63ff)\n`;
    });
    md += `![License](https://img.shields.io/badge/license-MIT-green?style=${badge})\n`;
    md += `![Stars](https://img.shields.io/github/stars/${author}/${slug}?style=${badge})\n`;
    md += `\n`;
  }

  md += `</div>\n\n`;
  md += `---\n\n`;

  // About
  md += `## 📌 ${t.about}\n\n`;
  md += `${desc}\n\n`;

  // Built with
  md += `### ${t.builtWith}\n\n`;
  stackArr.forEach(tech => { md += `- **${tech}**\n`; });
  md += `\n`;

  // Features
  if (secs.features) {
    md += `## ✨ ${t.features}\n\n`;
    t.featList.forEach(f => { md += `- ${f}\n`; });
    md += `\n`;
  }

  // Demo
  if (secs.demo) {
    md += `## 🎬 ${t.demo}\n\n`;
    md += `> ${t.demoText}\n\n`;
    md += `![Demo](https://via.placeholder.com/800x400/1a1d27/6c63ff?text=${encodeURIComponent(name)}+Demo)\n\n`;
  }

  // Getting Started / Installation
  if (secs.installation) {
    md += `## 🚀 ${t.getStarted}\n\n`;
    md += `### ${t.prereqs}\n\n`;
    stackArr.forEach(tech => { md += `- ${tech}\n`; });
    md += `\n`;
    md += `### ${t.installation}\n\n`;
    md += `#### ${t.steps}\n\n`;
    md += `1. **${t.cloneRepo}**\n\n`;
    md += `\`\`\`bash\ngit clone https://github.com/${author}/${slug}.git\ncd ${slug}\n\`\`\`\n\n`;
    md += `2. **${t.installDeps}**\n\n`;

    // Smart install command based on stack
    const hasNode = stackArr.some(t => /node|react|vue|next|angular|express|npm|yarn/i.test(t));
    const hasPy   = stackArr.some(t => /python|django|flask|fastapi/i.test(t));
    const hasRust  = stackArr.some(t => /rust/i.test(t));
    const hasGo    = stackArr.some(t => /go(?:lang)?/i.test(t));

    if (hasNode) md += `\`\`\`bash\nnpm install\n\`\`\`\n\n`;
    else if (hasPy) md += `\`\`\`bash\npip install -r requirements.txt\n\`\`\`\n\n`;
    else if (hasRust) md += `\`\`\`bash\ncargo build\n\`\`\`\n\n`;
    else if (hasGo) md += `\`\`\`bash\ngo mod tidy\n\`\`\`\n\n`;
    else md += `\`\`\`bash\nnpm install\n\`\`\`\n\n`;

    md += `3. **${t.start}**\n\n`;
    if (hasNode) md += `\`\`\`bash\nnpm start\n# or\nnpm run dev\n\`\`\`\n\n`;
    else if (hasPy) md += `\`\`\`bash\npython main.py\n\`\`\`\n\n`;
    else if (hasRust) md += `\`\`\`bash\ncargo run\n\`\`\`\n\n`;
    else if (hasGo) md += `\`\`\`bash\ngo run main.go\n\`\`\`\n\n`;
    else md += `\`\`\`bash\nnpm start\n\`\`\`\n\n`;
  }

  // Usage
  if (secs.usage) {
    md += `## 📖 ${t.usage}\n\n`;
    md += `\`\`\`bash\n# ${t.usage} example\n${slug} --help\n\`\`\`\n\n`;
    md += `Refer to the documentation for detailed usage instructions and examples.\n\n`;
  }

  // API Reference
  if (secs.api) {
    md += `## 🔌 ${t.api}\n\n`;
    md += `${t.apiText}\n\n`;
    md += `| Endpoint | Method | Description |\n`;
    md += `|----------|--------|-------------|\n`;
    md += `| \`/api/v1/resource\` | \`GET\` | Retrieve all resources |\n`;
    md += `| \`/api/v1/resource/:id\` | \`GET\` | Retrieve a single resource |\n`;
    md += `| \`/api/v1/resource\` | \`POST\` | Create a new resource |\n`;
    md += `| \`/api/v1/resource/:id\` | \`PUT\` | Update a resource |\n`;
    md += `| \`/api/v1/resource/:id\` | \`DELETE\` | Delete a resource |\n\n`;
  }

  // Tests
  if (secs.tests) {
    md += `## 🧪 ${t.tests}\n\n`;
    md += `${t.testText}\n\n`;
    const hasNode = stackArr.some(t => /node|react|vue|next|angular|express|npm|yarn/i.test(t));
    const hasPy   = stackArr.some(t => /python|django|flask|fastapi/i.test(t));
    if (hasNode) md += `\`\`\`bash\nnpm test\n# or with coverage:\nnpm run test:coverage\n\`\`\`\n\n`;
    else if (hasPy) md += `\`\`\`bash\npytest\n# or:\npython -m pytest --cov=.\n\`\`\`\n\n`;
    else md += `\`\`\`bash\nnpm test\n\`\`\`\n\n`;
  }

  // Roadmap
  if (secs.roadmap) {
    md += `## 🗺️ ${t.roadmap}\n\n`;
    md += `- [x] Initial release\n- [ ] Add more features\n- [ ] Improve documentation\n- [ ] Add more tests\n\n`;
    md += `> ${t.roadmapText}\n\n`;
  }

  // Contributing
  if (secs.contributing) {
    md += `## 🤝 ${t.contributing}\n\n`;
    md += `${t.contributeText}\n\n`;
    md += `1. Fork the repository\n`;
    md += `2. Create your feature branch (\`git checkout -b feature/amazing-feature\`)\n`;
    md += `3. Commit your changes (\`git commit -m 'Add some amazing feature'\`)\n`;
    md += `4. Push to the branch (\`git push origin feature/amazing-feature\`)\n`;
    md += `5. Open a Pull Request\n\n`;
  }

  // License
  if (secs.license) {
    md += `## 📄 ${t.license}\n\n`;
    md += `${t.licenseText}\n\n`;
  }

  // Acknowledgements
  if (secs.acknowledgements) {
    md += `## 💙 ${t.acknowledgements}\n\n`;
    md += `${t.ackText}\n\n`;
    stackArr.forEach(tech => { md += `- [${tech}](https://github.com)\n`; });
    md += `\n`;
  }

  // Contact
  if (secs.contact) {
    md += `## 📬 ${t.contact}\n\n`;
    md += `${t.contactText}\n\n`;
    md += `- GitHub: [@${author}](https://github.com/${author})\n`;
    md += `- Project: [https://github.com/${author}/${slug}](https://github.com/${author}/${slug})\n\n`;
  }

  // Footer
  md += `---\n\n`;
  md += `<div align="center">\n`;
  md += `Made with ❤️ by <a href="https://github.com/${author}">@${author}</a>\n`;
  md += `</div>\n`;

  currentMarkdown = md;
  renderOutput();

  // Animate button feedback
  const btn = document.getElementById('generateBtn');
  btn.innerHTML = '<span>✓</span> Generated!';
  btn.style.background = 'linear-gradient(135deg, #4ade80, #22c55e)';
  setTimeout(() => {
    btn.innerHTML = '<span>✦</span> Generate README';
    btn.style.background = '';
  }, 1800);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderOutput() {
  const oc = document.getElementById('outputContent');
  if (!currentMarkdown) return;

  if (currentTab === 'raw') {
    oc.innerHTML = `<pre id="raw-view">${escapeHtml(currentMarkdown)}</pre>`;
  } else {
    oc.innerHTML = `<div id="preview-view">${markdownToHtml(currentMarkdown)}</div>`;
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Minimal markdown → HTML (enough for README preview)
function markdownToHtml(md) {
  let html = md;

  // Remove div align tags (handle separately)
  html = html.replace(/<div align="center">/g, '<div style="text-align:center">');

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code class="language-${lang}">${escapeHtml(code.trim())}</code></pre>`);

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables
  html = html.replace(/(\|.+\|\n)(\|[-| :]+\|\n)((\|.+\|\n)*)/g, (match) => {
    const rows = match.trim().split('\n');
    const header = rows[0].split('|').filter(c=>c.trim()).map(c=>`<th>${c.trim()}</th>`).join('');
    const body = rows.slice(2).map(r =>
      '<tr>' + r.split('|').filter(c=>c.trim()).map(c=>`<td>${c.trim()}</td>`).join('') + '</tr>'
    ).join('\n');
    return `<table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>\n`;
  });

  // Headers
  html = html.replace(/^#{6}\s(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#{5}\s(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#{4}\s(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^#{3}\s(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^#{2}\s(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#{1}\s(.+)$/gm, '<h1>$1</h1>');

  // HR
  html = html.replace(/^---$/gm, '<hr>');

  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered list
  html = html.replace(/(^- .+\n?)+/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^- /, '')}</li>`).join('');
    return `<ul>${items}</ul>\n`;
  });

  // Ordered list
  html = html.replace(/(^\d+\. .+\n?)+/gm, match => {
    const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>\n`;
  });

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

  // Images
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:8px 0;">');

  // Badges (shield.io images)
  // already handled by images above

  // Paragraphs — wrap loose lines
  html = html.replace(/^(?!<[a-zA-Z]).+$/gm, line => line ? `<p>${line}</p>` : '');

  // Newlines
  html = html.replace(/\n{2,}/g, '\n');

  return html;
}

// ─── COPY / DOWNLOAD ──────────────────────────────────────────────────────────
async function copyReadme() {
  if (!currentMarkdown) return;
  await navigator.clipboard.writeText(currentMarkdown);
  const btn = document.getElementById('copyBtn');
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copied!';
  btn.classList.add('success');
  setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('success'); }, 2000);
}

function downloadReadme() {
  if (!currentMarkdown) return;
  const filename = selectedLang === 'en' ? 'README.md' : `README.${selectedLang}.md`;
  const blob = new Blob([currentMarkdown], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
