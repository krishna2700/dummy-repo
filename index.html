<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Counter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #eef2ff;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #22c55e;
      --success-light: #f0fdf4;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* ── Counter Banner ── */
    .counter-banner {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .counter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 28px;
      text-align: center;
      min-width: 110px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }

    .counter-card:hover { transform: translateY(-2px); }

    .counter-card .count {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      transition: color 0.2s;
    }

    .counter-card .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 6px;
    }

    .counter-card.total .count  { color: var(--accent); }
    .counter-card.active .count { color: var(--danger); }
    .counter-card.done .count   { color: var(--success); }

    /* ── Input Row ── */
    .add-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
    }

    .add-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 9999px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      background: var(--surface);
      color: var(--text);
    }

    .add-row input:focus { border-color: var(--accent); }

    .add-row input::placeholder { color: var(--muted); }

    .add-row button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .add-row button:hover  { background: var(--accent-hover); transform: translateY(-1px); }
    .add-row button:active { transform: translateY(0); }

    /* ── Filter Tabs ── */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 9999px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Todo List ── */
    .todo-list {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: opacity 0.2s, transform 0.15s, border-color 0.2s;
      animation: slideIn 0.18s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .todo-item.completed {
      border-color: var(--success);
      background: var(--success-light);
    }

    .todo-item.removing {
      opacity: 0;
      transform: translateX(20px);
    }

    /* Custom checkbox */
    .check-wrap {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      position: relative;
      cursor: pointer;
    }

    .check-wrap input[type="checkbox"] {
      opacity: 0;
      position: absolute;
      inset: 0;
      cursor: pointer;
      z-index: 1;
    }

    .check-box {
      position: absolute;
      inset: 0;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: #fff;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check-wrap input:checked ~ .check-box {
      background: var(--success);
      border-color: var(--success);
    }

    .check-box::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px) scale(0);
      transition: transform 0.12s ease;
    }

    .check-wrap input:checked ~ .check-box::after {
      transform: rotate(45deg) translate(-1px, -1px) scale(1);
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete-btn {
      flex-shrink: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 1.1rem;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: var(--danger-light);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 0.92rem;
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* ── Clear completed ── */
    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-top: 12px;
      padding: 0 4px;
    }

    .actions-row span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .clear-btn {
      font-size: 0.82rem;
      color: var(--danger);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .clear-btn:hover { background: var(--danger-light); }
    .clear-btn:disabled { opacity: 0.35; cursor: default; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .counter-card { padding: 14px 20px; min-width: 90px; }
      .counter-card .count { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Todo Counter</h1>
  <p>Track tasks, stay on top of things.</p>
</header>

<!-- Counter cards -->
<div class="counter-banner">
  <div class="counter-card total">
    <div class="count" id="count-total">0</div>
    <div class="label">Total</div>
  </div>
  <div class="counter-card active">
    <div class="count" id="count-active">0</div>
    <div class="label">Remaining</div>
  </div>
  <div class="counter-card done">
    <div class="count" id="count-done">0</div>
    <div class="label">Completed</div>
  </div>
</div>

<!-- Input -->
<div class="add-row">
  <input type="text" id="new-todo" placeholder="Add a new task and press Enter…" maxlength="200" />
  <button onclick="addTodo()">Add</button>
</div>

<!-- Filters -->
<div class="filters">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" data-filter="active" onclick="setFilter('active', this)">Active</button>
  <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Completed</button>
</div>

<!-- List -->
<div class="todo-list" id="todo-list"></div>

<!-- Actions row -->
<div class="actions-row">
  <span id="items-left"></span>
  <button class="clear-btn" id="clear-btn" onclick="clearCompleted()">Clear completed</button>
</div>

<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  let currentFilter = 'all';
  let nextId = todos.length ? Math.max(...todos.map(t => t.id)) + 1 : 1;

  const input      = document.getElementById('new-todo');
  const listEl     = document.getElementById('todo-list');
  const cntTotal   = document.getElementById('count-total');
  const cntActive  = document.getElementById('count-active');
  const cntDone    = document.getElementById('count-done');
  const itemsLeft  = document.getElementById('items-left');
  const clearBtn   = document.getElementById('clear-btn');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({ id: nextId++, text, done: false });
    input.value = '';
    save();
    render();
  }

  function toggle(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    const el = document.querySelector(`[data-id="${id}"]`);
    if (el) {
      el.classList.add('removing');
      el.addEventListener('transitionend', () => {
        todos = todos.filter(t => t.id !== id);
        save();
        render();
      }, { once: true });
    }
  }

  function clearCompleted() {
    todos = todos.filter(t => !t.done);
    save();
    render();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const total  = todos.length;
    const done   = todos.filter(t => t.done).length;
    const active = total - done;

    cntTotal.textContent  = total;
    cntActive.textContent = active;
    cntDone.textContent   = done;

    itemsLeft.textContent = active === 1 ? '1 item left' : `${active} items left`;
    clearBtn.disabled = done === 0;

    const filtered = todos.filter(t => {
      if (currentFilter === 'active') return !t.done;
      if (currentFilter === 'done')   return t.done;
      return true;
    });

    if (filtered.length === 0) {
      const msgs = {
        all:    { icon: '📋', text: 'No tasks yet. Add one above!' },
        active: { icon: '🎉', text: 'No active tasks — you\'re all caught up!' },
        done:   { icon: '✨', text: 'No completed tasks yet.' },
      };
      const { icon, text } = msgs[currentFilter];
      listEl.innerHTML = `<div class="empty-state"><div class="icon">${icon}</div>${text}</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(t => `
      <div class="todo-item ${t.done ? 'completed' : ''}" data-id="${t.id}">
        <label class="check-wrap">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})" />
          <span class="check-box"></span>
        </label>
        <span class="todo-text">${escHtml(t.text)}</span>
        <button class="delete-btn" onclick="remove(${t.id})" title="Delete task">&#x2715;</button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
